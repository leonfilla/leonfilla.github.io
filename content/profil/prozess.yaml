# Prozesseigenschaften – Rahmenbedingungen der eigenen Küche, die Rezepte beeinflussen.
wasser:
  - Kaffeewasser über Blanco-Filtereinheit mit Magnesium-Kartusche
  - Umkehrosmose wird erwogen; Hauptziel ist die Aromenentfaltung anaerober Filterkaffees
kaffee:
  - Die xBloom liefert exakt die programmierte Temperatur. Röster-Empfehlungen sind meist Kesseltemperaturen und liegen daher auf der Studio eher 3–5 °C zu hoch.
  - Oracle Jet – Zeit ab Pumpenstart, Erst-Tropfen nur zur Diagnose
backen:
  - Bosch HNG978 – Brot mit Dampfstoß zu Beginn, Ende über Kerntemperatur
  - Levain- und Joghurt-Gärung temperaturgenau über Sous Vide im Instant Pot
  - pH-Messung mit Apera PH60F
raum: []
