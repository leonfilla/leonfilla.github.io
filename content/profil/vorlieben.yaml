# Vorlieben und Abneigungen – konkret, auf Zutaten- und Methodenebene.
# Bewusst ohne Ernährungs-Etiketten.
allgemein:
  - Alle Mengen in Gramm, auch Eier, Gewürze und Flüssigkeiten
  - Aktive Arbeitszeit minimieren, passive Zeit ist kein Problem
  - Neue Versionen bauen auf erprobten Ergebnissen auf statt auf unabhängigen Änderungen
  - Bei neuen Zutaten immer eine Alternative aus dem vorhandenen Vorrat nennen
  - Begründungen auf Mechanismus-Ebene (Lebensmittelchemie, Extraktion) statt Faustregeln
kaffee:
  - xBloom Studio – Dosis fest 16 g, für Konzentration nie die Dosis ändern; 8-g-Programme als Halbportion
  - Ziel bei anaeroben und Natural-Kaffees – funky, intensiv, fruchtig bis weinig, nicht neutralisiert
  - Rezepte paarweise mit klar unterscheidbaren Profilen
brot:
  - Milchsauer-mild statt essigsauer, offene Krume, knusprige Kruste
  - Frei geschoben, ohne Gusseisentopf
  - Gärung über pH-Endpunkt statt fester Zeiten
