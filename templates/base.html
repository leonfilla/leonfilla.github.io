<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titel %}{% endblock %}Leons Rezepte</title>
  <meta name="description" content="{% block beschreibung %}Rezepte für xBloom Studio, Oracle Jet, Brot, Instant Pot, Smoothies und mehr – mit Versionen, Gerätegrenzen und Kochmodus.{% endblock %}">
  <meta name="author" content="Leon Filla">
  <meta name="theme-color" content="#f5f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body style="--akzent: {% block akzent %}#9a3b2e{% endblock %}">
  <a class="sprung" href="#inhalt">Zum Inhalt</a>
  <header class="kopf">
    <a class="logo" href="/">Leons Rezepte</a>
    <nav aria-label="Hauptnavigation">
      <a href="/bohnen/"{% if pfad.startswith('/bohnen') %} aria-current="page"{% endif %}>Bohnen</a>
      <a href="/wissen/"{% if pfad.startswith('/wissen') %} aria-current="page"{% endif %}>Wissen</a>
      <a href="/profil/"{% if pfad.startswith('/profil') %} aria-current="page"{% endif %}>Profil</a>
    </nav>
  </header>
  <main id="inhalt" class="inhalt">
    {% block inhalt %}{% endblock %}
  </main>
  <footer class="fuss">
    <p><a href="/datenschutz/">Datenschutz</a> · <a href="/katalog.json">katalog.json</a></p>
    <p class="leise">© {{ jahr }} Leon Filla · Stand {{ stand }}</p>
  </footer>
  <button class="nach-oben" type="button" aria-label="Nach oben" hidden>↑</button>
  <script src="/static/app.js" defer></script>
</body>
</html>
